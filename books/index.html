   <script>
function show(id) {
  document.getElementById('reading').classList.remove('active');
  document.getElementById('read').classList.remove('active');
  document.getElementById('wish').classList.remove('active');
  document.getElementById('reading').classList.add('hide');
  document.getElementById('read').classList.add('hide');
  document.getElementById('wish').classList.add('hide');

  var ele = document.getElementById(id);
  ele.classList.remove('hide');
  ele.classList.add('active');

  document.getElementById('reading-tab').classList.remove('active');
  document.getElementById('read-tab').classList.remove('active');
  document.getElementById('wish-tab').classList.remove('active');
  document.getElementById(id + '-tab').classList.add('active');
};

(function() {
  var books=[];

  function loadLocalBooks() {
  $.getJSON('/data/books.json')
    .done(function(data) {
      renderBooks(data); // pass the data explicitly
    })
    .fail(() => {
      document.getElementById('loading').textContent = 'Failed to load. Please refresh and try again.';
    });
}

function renderBooks(books) {
    if (!books || books.length === 0) {
      document.getElementById('reading-total').innerHTML = '(0)';
      document.getElementById('reading').innerHTML = '<p class="site-empty">No books yet.</p>';
      document.getElementById('loading').classList.add('hide');
      show('reading');
      return;
    }
    console.log(books);  // Debug: check if books are loaded correctly
    document.getElementById('reading-total').innerHTML = '(' + books.length + ')';  // Update total book count
    var html = '';
    for (var i = 0; i < books.length; ++i) {
      html += renderBook(books[i]);  // Render each book
    }
    document.getElementById('reading').innerHTML = html;  // Insert books into the DOM
    show('reading');  // Show the 'reading' section
    document.getElementById('loading').classList.add('hide');  // Hide the loading message
  }

  function renderBook(book) {
    console.log(book);  // Debug: check each book object
    var bookInfo = book.read_info.bookInfo;  // Get book details
    var comment = (book.bookmark_list && book.bookmark_list.length > 0)
      ? book.bookmark_list[0].markText  // Use the first bookmark as a comment
      : 'No notes for this book';  // Default message if no bookmark is present

    return `
      <div class="col-sm-6 col-md-6">
        <div class="panel panel-default hover-grow">
          <div class="panel-body">
            <div class="media media-middle book" itemscope itemtype="http://schema.org/Book">
              <div class="media-left">
                <a class="media-middle" target="_blank" href="#" rel="external nofollow noopener noreferrer">
                  <img class="media-object" src="${bookInfo.cover}" itemprop="image"/>
                </a>
              </div>
              <div class="media-body">
                <h3 class="media-heading" itemprop="name">${bookInfo.title}</h3>
                <p class="meta text-nowrap-1x">
                  <small itemprop="author">${bookInfo.author}</small> /
                </p>
                <div class="comments text-muted text-nowrap-3x" itemprop="comment">${comment}</div>
              </div>
            </div>
          </div>
        </div>
      </div>`;
  }

  function show(id) {
    document.getElementById('reading').classList.remove('active');
    document.getElementById('reading').classList.remove('hide');
    document.getElementById('reading-tab').classList.add('active');
  }

  loadLocalBooks();
})();
</script>
